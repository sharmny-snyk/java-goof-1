name: Extract Email and Call Snyk API

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  snyk_check_progress:
    runs-on: ubuntu-latest
    
    env:
      SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
      SNYK_API_VERSION: "2025-11-05" 
      REQUIRED_COURSES: >
        {
          "70bf3b62-4a92-479c-0b27-7e866cedfbe2": "SQL Injection",
          "6a6dfe46-5d86-4acf-8430-50a35d5dd6e9": "Prototype Pollution",
          "be4a2ece-6507-4ed1-f3f1-d5d8d949c899": "Directory Traversal"
        }

    permissions:
      contents: read 

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Extract Emails from PR Commits
        id: extract
        run: |
          EMAILS=$(git log --format=%ae ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "emails_list=$EMAILS" >> $GITHUB_OUTPUT
          echo "Emails to check in Snyk: $EMAILS"
          
      - name: Call Snyk API and Check Progress
        run: |
          ALL_EMAILS="${{ steps.extract.outputs.emails_list }}"
          ORG_ID="${{ env.SNYK_ORG_ID }}"
          SNYK_API_TOKEN="${{ secrets.SNYK_TOKEN }}"
          API_VERSION="${{ env.SNYK_API_VERSION }}"
          
          ENCODED_EMAILS=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$ALL_EMAILS', safe=','))")
          
          API_ENDPOINT="https://api.snyk.io/rest/orgs/$ORG_ID/learn/progress/users"
          QUERY_PARAMS="?emails=$ENCODED_EMAILS&version=$API_VERSION&limit=100"
          
          echo "Calling Snyk API..."
          
          RESPONSE=$(curl --max-time 10 --fail -sS -G \
            -H "Authorization: token $SNYK_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$API_ENDPOINT$QUERY_PARAMS" || echo '{"errors":[{"detail":"curl_failed"}]}')
            
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "⚠️ Snyk API error, allowing PR (fail-open)"
            exit 0
          fi

          IFS=',' read -r -a EMAIL_ARRAY <<< "$ALL_EMAILS"
          REQUIRED_IDS=$(echo '${{ env.REQUIRED_COURSES }}' | jq -r 'keys[]')
          
          FAILED_VALIDATION=false

          for EMAIL in "${EMAIL_ARRAY[@]}"; do
            echo "------------------------------------------------"
            echo "Checking Contributor: $EMAIL"
            
            for COURSE_ID in $REQUIRED_IDS; do
              COURSE_NAME=$(echo '${{ env.REQUIRED_COURSES }}' | jq -r ".\"$COURSE_ID\"")
              
              # UPDATED: Using the new relationship-based jq filter
              STATUS=$(echo "$RESPONSE" | jq -r ".data[] | select(.relationships.user.data.attributes.email==\"$EMAIL\" and .relationships.catalog.data.id==\"$COURSE_ID\") | .attributes.status")
              
              if [ "$STATUS" = "completed" ]; then
                echo "  ✅ $COURSE_NAME: Completed"
              else
                echo "  ❌ $COURSE_NAME: Incomplete (Status: ${STATUS:-not_started})"
                FAILED_VALIDATION=true
              fi
            done
          done

          if [ "$FAILED_VALIDATION" = true ]; then
            echo "------------------------------------------------"
            echo "❌ ERROR: One or more authors have not completed mandatory training."
            exit 1
          else
            echo "------------------------------------------------"
            echo "✅ Success: All PR contributors are compliant."
          fi
