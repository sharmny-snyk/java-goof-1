name: Snyk Progressive Training Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  snyk_check_progress:
    runs-on: ubuntu-latest
    
    env:
      SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
      SNYK_API_VERSION: "2025-11-05"
      # Configuration
      RECENCY_THRESHOLD_MONTHS: 6
      MAX_OUTSTANDING_ASSIGNMENTS: 5
      BLOCK_ON_FAILURE: "true" 
      REQUIRED_COURSES: >
        {
          "70bf3b62-4a92-479c-0b27-7e866cedfbe2": "SQL Injection",
          "6a6dfe46-5d86-4acf-8430-50a35d5dd6e9": "Prototype Pollution",
          "be4a2ece-6507-4ed1-f3f1-d5d8d949c899": "Directory Traversal"
        }

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Extract Emails
        id: extract
        run: |
          EMAILS=$(git log --format=%ae ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "emails_list=$EMAILS" >> $GITHUB_OUTPUT

      - name: Validate Training and Check PR Compliance
        run: |
          ALL_EMAILS="${{ steps.extract.outputs.emails_list }}"
          SNYK_TOKEN="${{ secrets.SNYK_TOKEN }}"
          ORG_ID="${{ env.SNYK_ORG_ID }}"
          API_VER="${{ env.SNYK_API_VERSION }}"
          
          # FIX: Store JSON mapping in a shell variable to prevent "Unexpected EOF" errors
          COURSES_JSON='${{ env.REQUIRED_COURSES }}'

          # 1. URL Encode emails safely via Python arguments
          ENCODED_EMAILS=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=','))" "$ALL_EMAILS")
          
          # 2. Fetch Progress from Snyk API
          PROGRESS_RESP=$(curl -s -H "Authorization: token $SNYK_TOKEN" \
            "
